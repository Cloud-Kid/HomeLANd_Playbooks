---
- hosts: all
  become: true
    
  tasks:
    - name: Install Fastfetch
      apt:
        name: fastfetch
        state: present
      when: ansible_distribution == 'Ubuntu'
    
    - name: Create MOTD script
      copy:
        content: |
          #!/bin/bash
          fastfetch
        dest: /etc/update-motd.d/99-fastfetch
        mode: '0755'
      when: ansible_distribution == 'Ubuntu'
